---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: restored-cnpg-cluster-${USER_NAME}
  namespace: ${USER_NAME}
spec:
  instances: 1
  imageName: "${POSTGRES_DEFAULT_IMAGE}"

  enableSuperuserAccess: true
  imagePullPolicy: IfNotPresent
  
  bootstrap:
    recovery:
      source: source
  externalClusters:
  - name: source
    plugin:
      name: barman-cloud.cloudnative-pg.io
      parameters:
        barmanObjectName: minio-storage
        serverName: cnpg-cluster-${USER_NAME}
  
  plugins:
  - name: barman-cloud.cloudnative-pg.io
    isWALArchiver: true
    parameters:
      # Backup Object Store (push, read-write)
      barmanObjectName: minio-storage
  
  storage:
    size: ${POSTGRES_STORAGE}
  walStorage:
    size: ${POSTGRES_WAL_STORAGE}

  # Scheduling: Ensure pods spread across your 3 disks/nodes
  affinity:
    nodeSelector:
      node.workshop/role: postgres
    podAntiAffinityType: required # Strict: won't start 2 pods on 1 node
    topologyKey: kubernetes.io/hostname

  resources:
    requests:
      memory: "${POSTGRES_MEMORY}"
      cpu: "${POSTGRES_CPU}"
    limits:
      memory: "${POSTGRES_MAX_MEMORY}"
      cpu: "${POSTGRES_MAX_CPU}"